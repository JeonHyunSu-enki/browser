<!doctype html>
<script src="../testing.js"></script>
<style>body{margin:8px}</style>
<body></body>
<script>
function makeBox(css='',text=''){const el=document.createElement('div');el.style.cssText=css;el.textContent=text;document.body.append(el);return el}
</script>
<script id=client_dimensions>
{
  const el=makeBox('width:100px;height:50px;padding:10px;border:2px solid black');
  testing.expectEqual(120,el.clientWidth);testing.expectEqual(70,el.clientHeight);
  testing.expectEqual(124,el.offsetWidth);testing.expectEqual(74,el.offsetHeight);
  testing.expectEqual('100px',getComputedStyle(el).width);
  testing.expectEqual(124,el.getBoundingClientRect().width);el.remove();
}
</script>
<script id=scroll_content_growth>
{
  const el=makeBox('width:100px;display:flex;overflow:auto');
  const child=document.createElement('span');child.style.cssText='width:150px;height:20px;flex:none';el.append(child);
  testing.expectEqual(150,el.scrollWidth);el.append(child.cloneNode());
  testing.expectEqual(300,el.scrollWidth);testing.expectEqual(100,el.clientWidth);
  el.scrollLeft=9999;testing.expectEqual(200,el.scrollLeft);
  el.scrollLeft=-20;testing.expectEqual(0,el.scrollLeft);el.remove();
}
</script>
<script id=marquee_growth>
{
  const container=makeBox('width:40px;overflow:hidden');
  const lane=document.createElement('div');lane.style.cssText='display:flex;width:max-content';container.append(lane);
  const item=document.createElement('span');item.style.cssText='width:10px;height:10px;flex:none';lane.append(item);
  const before=lane.scrollWidth;lane.append(item.cloneNode());testing.expectEqual(before*2,lane.scrollWidth);
  let count=0;while(lane.clientWidth<container.clientWidth*2&&count<50){lane.append(item.cloneNode());count++}
  testing.expectTrue(count<50);testing.expectEqual(40,container.clientWidth);
  testing.expectEqual(lane.clientWidth,parseFloat(getComputedStyle(lane).width));container.remove();
}
</script>
<script id=vertical_scroll_growth>
{
  const el=makeBox('width:100px;height:50px;overflow:auto');
  const child=document.createElement('div');child.style.height='80px';el.append(child);
  testing.expectEqual(80,el.scrollHeight);el.append(child.cloneNode());testing.expectEqual(160,el.scrollHeight);
  el.scrollTop=9999;testing.expectEqual(110,el.scrollTop);
  el.scrollTo(0,10);el.scrollBy(0,9999);testing.expectEqual(110,el.scrollTop);
  el.scrollBy(0,-9999);testing.expectEqual(0,el.scrollTop);el.remove();
}
</script>
<script id=empty_hidden_and_text>
{
  const empty=makeBox('width:100px');testing.expectEqual(100,empty.scrollWidth);testing.expectEqual(0,empty.scrollHeight);
  empty.style.display='none';testing.expectEqual(0,empty.clientWidth);testing.expectEqual(0,empty.scrollWidth);empty.remove();
  const text=makeBox('width:100px;font-size:16px','one two three four five six seven eight nine ten');
  testing.expectTrue(text.clientHeight>0);testing.expectEqual(text.clientHeight,text.scrollHeight);
  const height=text.clientHeight;text.style.fontSize='8px';testing.expectTrue(text.clientHeight<height);text.remove();
}
</script>
<script id=sheet_size_and_auto>
{
  const style=document.createElement('style');style.textContent='.position_test_sheet{width:120px;height:50px;overflow:auto}';document.head.append(style);
  const el=makeBox();el.className='position_test_sheet';const child=document.createElement('div');child.style.height='200px';el.append(child);
  testing.expectEqual(50,el.clientHeight);testing.expectEqual('120px',getComputedStyle(el).width);
  el.scrollTop=9999;testing.expectEqual(150,el.scrollTop);
  el.style.height='auto';testing.expectEqual(200,el.clientHeight);el.scrollTop=9999;testing.expectEqual(0,el.scrollTop);
  el.remove();style.remove();
}
</script>
<script id=offset_and_scrolling>
{
  const spacer=makeBox('height:3000px');const el=makeBox('width:100px;height:50px');
  window.scrollTo(0,100);const r=el.getBoundingClientRect();testing.expectEqual(el.offsetTop,r.top+scrollY);
  testing.expectEqual(el.offsetLeft,r.left+scrollX);window.scrollTo(0,0);
  const parent=makeBox('position:relative;width:200px;height:200px');const child=document.createElement('div');
  child.style.cssText='position:absolute;left:30px;top:40px;width:20px;height:20px';parent.append(child);
  testing.expectEqual(parent,child.offsetParent);testing.expectEqual(30,child.offsetLeft);testing.expectEqual(40,child.offsetTop);
  parent.remove();el.remove();spacer.remove();
}
</script>
<script id=transforms_do_not_change_offsets>
{
  const parent=makeBox('position:relative;width:100px;height:50px');const child=document.createElement('div');child.style.cssText='width:20px;height:10px';parent.append(child);
  const left=child.getBoundingClientRect().left;const offset=child.offsetLeft;
  parent.style.transform='translateX(-12.5px)';testing.expectEqual(left-12.5,child.getBoundingClientRect().left);testing.expectEqual(offset,child.offsetLeft);
  child.style.transform='translateX(5px)';testing.expectEqual(left-7.5,child.getBoundingClientRect().left);
  testing.expectEqual(20,child.offsetWidth);parent.remove();
}
</script>
